services:
  postgres:
    image: postgres:16-alpine
    container_name: anime_assistant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - anime_assistant_net

  n8n:
    image: n8nio/n8n:latest
    container_name: anime_assistant_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Слушаем только на localhost — наружу отдаём через reverse-proxy
      # (Caddy/Nginx) с TLS, а не открываем 5678 напрямую в интернет.
      - "127.0.0.1:5678:5678"
    environment:
      # --- База данных (вместо дефолтной SQLite — так надёжнее и переносимее) ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- Сеть / вебхуки ---
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_HOST}/
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}

      # --- Безопасность ---
      # КРИТИЧНО: сохраните этот ключ отдельно (например, в менеджере паролей).
      # Если он потеряется или изменится — n8n не сможет расшифровать уже
      # сохранённые credentials (токен Telegram-бота, ключи Shikimori и т.д.),
      # и их придётся вводить заново.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "true"
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - anime_assistant_net

  # --- Caddy как reverse-proxy с автоматическим TLS. ---
  # Этот сервис нужен, если вы хотите принимать вебхуки Telegram напрямую
  # через публичный HTTPS-домен. Если вы используете Telegram Node в режиме
  # polling, то Caddy можно не запускать.
  caddy:
    image: caddy:2-alpine
    container_name: anime_assistant_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - anime_assistant_net

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  anime_assistant_net:
    driver: bridge
