name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python scripts
        run: python -m py_compile migrate_animelib_to_shikimori.py "второй код.py"

      - name: Validate Docker Compose
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
          N8N_HOST: ci.example.com
          TZ: UTC
          N8N_ENCRYPTION_KEY: ci-only-key
        run: docker compose config --quiet